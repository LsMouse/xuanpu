scalar JSON

enum AgentRuntime {
  opencode
  claude_code
  codex
  terminal
}

type CanonicalAgentEvent {
  type: String!
  sessionId: String!
  runtimeId: String
  data: JSON!
  childSessionId: String
  statusPayload: SessionStatusPayload
}

type SessionStatusPayload {
  type: String!
  attempt: Int
  message: String
  next: Int
}

type PermissionRequest {
  id: String!
  sessionID: String!
  permission: String!
  patterns: [String!]!
  metadata: JSON
  always: [String!]!
  tool: PermissionTool
}

type PermissionTool {
  messageID: String!
  callID: String!
}

type AgentCommand {
  name: String!
  description: String
  template: String!
  agent: String
  model: String
  source: String
  subtask: Boolean
  hints: [String!]
}

type AgentCapabilities {
  supportsUndo: Boolean!
  supportsRedo: Boolean!
  supportsCommands: Boolean!
  supportsPermissionRequests: Boolean!
  supportsQuestionPrompts: Boolean!
  supportsModelSelection: Boolean!
  supportsReconnect: Boolean!
  supportsPartialStreaming: Boolean!
}

# --- Inputs ---

input AgentReconnectInput {
  worktreePath: String!
  runtimeSessionId: String!
  hiveSessionId: ID!
}

input AgentPromptInput {
  worktreePath: String!
  runtimeSessionId: String!
  message: String
  parts: [AgentMessagePartInput!]
  model: AgentModelInput
}

input AgentMessagePartInput {
  type: String!
  text: String
  mime: String
  url: String
  filename: String
}

input AgentModelInput {
  providerID: String!
  modelID: String!
  variant: String
}

input AgentSetModelInput {
  providerID: String!
  modelID: String!
  variant: String
  runtime: AgentRuntime
}

input AgentCommandInput {
  worktreePath: String!
  runtimeSessionId: String!
  command: String!
  args: String!
  model: AgentModelInput
}

input AgentRenameSessionInput {
  runtimeSessionId: String!
  title: String!
  worktreePath: String
}

input AgentForkSessionInput {
  worktreePath: String!
  runtimeSessionId: String!
  messageId: String
}

input AgentQuestionReplyInput {
  requestId: String!
  answers: [[String!]!]!
  worktreePath: String
}

input AgentPlanApproveInput {
  worktreePath: String!
  hiveSessionId: ID!
  requestId: String
}

input AgentPlanRejectInput {
  worktreePath: String!
  hiveSessionId: ID!
  feedback: String!
  requestId: String
}

input AgentPermissionReplyInput {
  requestId: String!
  reply: String!
  worktreePath: String
  message: String
}
